replicaCount: 1

image:
  repository: nginx
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

  className: ""

  annotations: {}

  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix

  tls: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 200m
    memory: 256Mi


serviceAccount:
  create: true
  name: ""

config:
  APP_ENV: development

secret:
  USERNAME: admin
  PASSWORD: admin123

httpRoute:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}

autoscaling:
  enabled: true

  minReplicas: 2
  maxReplicas: 5

  targetCPUUtilizationPercentage: 80

  # Uncomment later if required
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true

  minAvailable: 1

  # Alternative:
  # maxUnavailable: 1

networkPolicy:
  enabled: true

  ingress:
    enabled: true

  egress:
    enabled: true
