apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: redis
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/roshikhosla04/gitops-demo.git
    targetRevision: main
    path: charts/redis

    helm:
      valueFiles:
        - ../../environments/dev/redis-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: redis

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
