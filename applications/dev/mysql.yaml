apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: mysql
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/roshikhosla04/gitops-demo.git
    targetRevision: main
    path: charts/mysql

    helm:
      valueFiles:
        - ../../environments/dev/mysql-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: mysql

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
